<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<rect x="250" y="20" width="440" height="330" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="262" y="40" font-size="13" font-weight="700" fill="#2563eb">RP2350 (Pico 2), 150 MHz</text>
<rect x="275" y="55" width="390" height="120" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="470.0" y="89.0" font-size="13" font-weight="700" text-anchor="middle">Core 0: PWM-wrap ISR, exactly 1 kHz</text>
<text x="470.0" y="104.0" font-size="11" font-weight="400" text-anchor="middle">read IMU (I2C) → IIR low-pass ax, az → atan2</text>
<text x="470.0" y="119.0" font-size="11" font-weight="400" text-anchor="middle">complementary filter (0.999 / 0.001)</text>
<text x="470.0" y="134.0" font-size="11" font-weight="400" text-anchor="middle">button debounce + 0°/+30°/−30°/0° sequence</text>
<text x="470.0" y="149.0" font-size="11" font-weight="400" text-anchor="middle">PID, conditional integration, clamp 0–6000, slew +20/ms</text>
<rect x="275" y="215" width="180" height="60" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="365.0" y="241.5" font-size="13" font-weight="700" text-anchor="middle">Core 0: serial thread</text>
<text x="365.0" y="256.5" font-size="11" font-weight="400" text-anchor="middle">a, p, i, d, m, c, n, t</text>
<rect x="485" y="215" width="180" height="60" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="575.0" y="241.5" font-size="13" font-weight="700" text-anchor="middle">Core 1: draw thread</text>
<text x="575.0" y="256.5" font-size="11" font-weight="400" text-anchor="middle">plots + text, every frame</text>
<rect x="485" y="290" width="180" height="45" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="575.0" y="309.0" font-size="13" font-weight="700" text-anchor="middle">VGA driver</text>
<text x="575.0" y="324.0" font-size="11" font-weight="400" text-anchor="middle">3 PIO SMs + DMA chain</text>
<line x1="365" y1="215" x2="365" y2="177" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/><text x="372" y="200" font-size="11" fill="#444" text-anchor="start">volatile globals</text>
<line x1="575" y1="177" x2="575" y2="213" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/><text x="582" y="200" font-size="11" fill="#444" text-anchor="start">angle / duty buffers</text>
<line x1="575" y1="275" x2="575" y2="288" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="70" width="170" height="60" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="115.0" y="96.5" font-size="13" font-weight="700" text-anchor="middle">MPU-6050 IMU</text>
<text x="115.0" y="111.5" font-size="11" font-weight="400" text-anchor="middle">on the arm, ±2 g, ±250 °/s</text>
<line x1="200" y1="100" x2="273" y2="100" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/><text x="236.5" y="94.0" font-size="11" fill="#444" text-anchor="middle">I2C0 400 kHz</text>
<rect x="30" y="215" width="170" height="60" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="115.0" y="241.5" font-size="13" font-weight="700" text-anchor="middle">Serial terminal</text>
<text x="115.0" y="256.5" font-size="11" font-weight="400" text-anchor="middle">laptop (UART / USB)</text>
<line x1="200" y1="245" x2="273" y2="245" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/><text x="236.5" y="239.0" font-size="11" fill="#444" text-anchor="middle">UART</text>
<rect x="30" y="300" width="170" height="50" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="115.0" y="321.5" font-size="13" font-weight="700" text-anchor="middle">Demo button</text>
<text x="115.0" y="336.5" font-size="11" font-weight="400" text-anchor="middle">GPIO 15 → GND</text>
<path d="M 200 325 L 237 325 L 237 160 L 273 160" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="242" y="315" font-size="11" fill="#444">polled in ISR</text>
<rect x="760" y="305" width="200" height="45" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="860.0" y="324.0" font-size="13" font-weight="700" text-anchor="middle">VGA monitor</text>
<text x="860.0" y="339.0" font-size="11" font-weight="400" text-anchor="middle">640 × 480, 16 colours</text>
<line x1="667" y1="318" x2="758" y2="325" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/><text x="712.5" y="315.5" font-size="11" fill="#444" text-anchor="middle">GPIO 16–21</text>
<rect x="760" y="70" width="200" height="50" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="860.0" y="91.5" font-size="13" font-weight="700" text-anchor="middle">4N35 optoisolator</text>
<text x="860.0" y="106.5" font-size="11" font-weight="400" text-anchor="middle">LED side on Pico ground</text>
<line x1="667" y1="95" x2="758" y2="95" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/><text x="712.5" y="89.0" font-size="11" fill="#444" text-anchor="middle">PWM, GPIO 4</text>
<rect x="760" y="150" width="200" height="50" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="860.0" y="171.5" font-size="13" font-weight="700" text-anchor="middle">IRLB8721 MOSFET</text>
<text x="860.0" y="186.5" font-size="11" font-weight="400" text-anchor="middle">12 V gate, 1N4001, 0.1 µF</text>
<line x1="860" y1="120" x2="860" y2="148" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="760" y="230" width="200" height="50" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="860.0" y="251.5" font-size="13" font-weight="700" text-anchor="middle">Ducted motor</text>
<text x="860.0" y="266.5" font-size="11" font-weight="400" text-anchor="middle">5 V supply, thrust ∝ ω²</text>
<line x1="860" y1="200" x2="860" y2="228" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="380" y="440" width="240" height="60" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="500.0" y="466.5" font-size="13" font-weight="700" text-anchor="middle">Lever arm angle φ</text>
<text x="500.0" y="481.5" font-size="11" font-weight="400" text-anchor="middle">hinge: torque = thrust − gravity − friction</text>
<path d="M 960 255 L 985 255 L 985 470 L 622 470" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="800" y="463" font-size="11" fill="#9a3412">thrust lifts the arm</text>
<path d="M 378 470 L 12 470 L 12 100 L 28 100" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="20" y="463" font-size="11" fill="#9a3412">IMU rotates with the arm</text>
<line x1="760" y1="95" x2="760" y2="95"/>
<text x="735" y="540" font-size="11" fill="#666" text-anchor="middle">Only light crosses the 4N35: the Pico and motor sides have separate supplies and grounds.</text>
</svg>